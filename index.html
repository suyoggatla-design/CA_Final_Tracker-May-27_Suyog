<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d"><title>CA Final Study Hub</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#15243a;--muted:#627087;--accent:#315cba;--line:#e0e7f0;--green:#167d55;--orange:#bd6a19}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:linear-gradient(120deg,#14243a,#315cba);color:white;padding:22px 18px}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;opacity:.85}.wrap{max-width:1100px;margin:auto;padding:14px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}.nav button,.btn{border:0;border-radius:10px;padding:10px 13px;background:#e4eaf5;color:#183052;font-weight:650;cursor:pointer}.nav button.active,.btn.primary{background:var(--accent);color:white}.btn.danger{background:#fee8e8;color:#9a2929}.btn.small{padding:7px 9px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 2px 9px #2035500a}.metric{font-size:28px;font-weight:750}.muted{color:var(--muted);font-size:13px}.progress{height:9px;background:#e8edf5;border-radius:9px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--accent);border-radius:9px}.subject-list{display:grid;gap:10px}.subject-row{display:grid;grid-template-columns:1fr minmax(100px,180px) auto;gap:12px;align-items:center}.subject-row strong{display:block}.section{margin-top:16px}.section h2{font-size:19px;margin:5px 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.select,input,textarea{border:1px solid var(--line);border-radius:9px;padding:9px;background:white;color:var(--ink);font:inherit;width:100%}textarea{min-height:72px}.chapter{border:1px solid var(--line);padding:12px;border-radius:12px;margin:9px 0;background:white}.chapter-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.chapter-title{font-weight:700}.checks{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}.checks label{display:flex;align-items:center;gap:5px;font-size:13px}.checks input{width:auto}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{background:#f0f4fa}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.notice{padding:12px;border-radius:12px;background:#fff4df;border:1px solid #f1dfba;color:#704b10;margin:12px 0;font-size:13px}.hidden{display:none}.empty{padding:22px;text-align:center;color:var(--muted)}footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:600px){header h1{font-size:21px}.subject-row{grid-template-columns:1fr}.checks{gap:8px}.wrap{padding:10px}}

/* Cinematic dark-red theme inspired by the supplied poster */
:root{color-scheme:dark;--bg:#08090d;--card:rgba(13,15,21,.88);--ink:#f1f1f3;--muted:#a3a6b0;--accent:#c51f3a;--line:rgba(255,255,255,.12);--green:#48bd8a;--orange:#f0a34b}
html{background:#08090d}
body{background:radial-gradient(ellipse at 50% 0%,rgba(133,12,31,.34),transparent 48%),linear-gradient(180deg,rgba(5,6,9,.58),rgba(5,6,9,.94)),#08090d;background-attachment:fixed;color:var(--ink)}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 16%,rgba(185,18,46,.18),transparent 38%),radial-gradient(ellipse at 8% 48%,rgba(125,15,31,.12),transparent 34%),radial-gradient(ellipse at 92% 70%,rgba(125,15,31,.10),transparent 34%),repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 1px,transparent 1px 5px)}
header{background:linear-gradient(105deg,rgba(5,6,9,.97),rgba(62,8,19,.94) 55%,rgba(10,10,14,.97));border-bottom:1px solid rgba(225,36,62,.48);box-shadow:0 12px 38px rgba(0,0,0,.42);position:relative;overflow:hidden}
header:after{content:"";position:absolute;width:340px;height:180px;right:-90px;top:-110px;background:radial-gradient(ellipse,rgba(220,24,55,.32),transparent 68%);pointer-events:none}
header h1{letter-spacing:.2px;text-shadow:0 2px 18px rgba(230,20,54,.28)}
header p{color:#d2cbd0}
.wrap{position:relative}
.nav button,.btn{background:#20212a;color:#ececf0;border:1px solid rgba(255,255,255,.09);box-shadow:0 3px 12px rgba(0,0,0,.18)}
.nav button.active,.btn.primary{background:linear-gradient(135deg,#a91530,#df2947);color:white;border-color:#ef5269;box-shadow:0 5px 18px rgba(185,20,48,.28)}
.btn.danger{background:#45151e;color:#ffb8c2;border-color:#792434}
.card,.chapter{background:var(--card);border:1px solid var(--line);box-shadow:0 9px 28px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
.card h2,.chapter-title{color:#f5f3f4}
.metric{color:#fff}
.muted{color:var(--muted)}
.progress{background:#292a32}
.progress span{background:linear-gradient(90deg,#a91430,#ed405a)}
.select,input,textarea{background:#171920;color:#f2f2f4;border-color:#3b3d47}
.select:focus,input:focus,textarea:focus{outline:2px solid rgba(220,43,70,.42);border-color:#d52b48}
input::placeholder,textarea::placeholder{color:#858894}
.chapter{background:rgba(15,17,23,.91)}
.checks label{color:#d9d9de}
.checks input{accent-color:#d52b48}
table{color:#e8e8eb}
td,th{border-bottom-color:rgba(255,255,255,.1)}
th{background:#22232c;color:#fff}
.notice{background:rgba(82,48,14,.34);border-color:rgba(218,153,55,.35);color:#f4d49b}
a{color:#ff8295}

footer{color:#858894}
@media(max-width:600px){header{padding-top:20px;padding-bottom:20px}}

</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icon-glowing-book.svg"><link rel="apple-touch-icon" href="icon-glowing-book.svg"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<header><h1>📚 CA Final Study Hub</h1><p>May 2027 · Target: 3 revisions + 3 mocks by 15 April 2027</p></header>
<div class="wrap"><div class="nav" id="nav"></div><main id="app"></main><footer>Offline-first · Data stored in this browser on this device. Export backups regularly.</footer></div>
<script>
const subjects=["FR","AFM","Audit","DT","IDT","IBS"], full={FR:"Financial Reporting",AFM:"Advanced Financial Management",Audit:"Advanced Auditing",DT:"Direct Taxation",IDT:"Indirect Taxation",IBS:"Integrated Business Solutions"};
// Editable starter chapter headings; detailed chapter mapping is NOT verified against the May 2027 ICAI release.
const starters={
FR:["Ind AS 1–10","Ind AS 12–20","Ind AS 21–29","Ind AS 32, 33 & 36","Ind AS 37–41","Consolidated Financial Statements","Business Combinations","Financial Instruments","Special Transactions & Reporting","Other / remaining syllabus"],
AFM:["Financial Policy & Strategic Management","Risk Management","Security Analysis","Portfolio Management","Derivatives","Forex Management","International Financial Management","Interest Rate Risk Management","Corporate Valuation","Mergers & Acquisitions","Other / remaining syllabus"],
Audit:["Quality Management","Audit Planning & Risk Assessment","Audit Evidence","Audit of Financial Statements","Audit of Specific Items","Audit of Special Entities","Group Audits","Bank Audit","Insurance Audit","Other / remaining syllabus"],
DT:["Basic Concepts & Residential Status","Heads of Income","Income Computation & Deductions","Taxation of Individuals","Taxation of Companies","International Taxation","Transfer Pricing","Assessment & Appeals","Tax Audit & Ethics","Other / remaining syllabus"],
IDT:["GST Overview & Supply","Place & Time of Supply","Value of Supply","Input Tax Credit","Registration & Returns","Payment & Refunds","GST Audit & Assessment","Customs: Basics & Valuation","Customs: Procedures & Duty","Other / remaining syllabus"],
IBS:["Case Study Practice 1","Case Study Practice 2","Case Study Practice 3","Case Study Practice 4","Case Study Practice 5","Case Study Practice 6","Case Study Practice 7","Case Study Practice 8"]
};
const blank=()=>({chapters:{},logs:[],mocks:[{}, {}, {}],weak:[]});
let data=load(),tab="Dashboard",subject="FR";
function load(){try{return JSON.parse(localStorage.getItem("cafinalhub")||"{}")}catch(e){return {}}}
function save(){localStorage.setItem("cafinalhub",JSON.stringify(data));}
function init(){subjects.forEach(s=>{if(!data[s])data[s]=blank();starters[s].forEach((c,i)=>{let id="c"+i;if(!data[s].chapters[id])data[s].chapters[id]={name:c,lecture:false,r1:false,r2:false,exam:false};});});if(!data.logs)data.logs=[];if(!data.mocks)data.mocks=[{}, {}, {}];if(!data.weak)data.weak=[];save()}
init();
const pct=(n,d)=>d?Math.round(n/d*100):0, esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function totals(){let all=subjects.flatMap(s=>Object.values(data[s].chapters));return {all,done:all.filter(c=>c.exam).length,marks:all.reduce((n,c)=>n+(c.lecture?1:0)+(c.r1?1:0)+(c.r2?1:0)+(c.exam?1:0),0)}}
function subjectPct(s){let cs=Object.values(data[s].chapters);return pct(cs.reduce((n,c)=>n+(c.lecture?1:0)+(c.r1?1:0)+(c.r2?1:0)+(c.exam?1:0),0),cs.length*4)}
function progressbar(p){return `<div class="progress"><span style="width:${p}%"></span></div><span class="muted">${p}%</span>`}
function nav(){let names=["Dashboard","Chapters","Daily Log","Mock Tests","Weak Topics","Backup"];document.getElementById("nav").innerHTML=names.map(n=>`<button class="${tab===n?"active":""}" onclick="tab='${n}';render()">${n}</button>`).join("")}
function render(){nav();let a=document.getElementById("app");if(tab==="Dashboard")a.innerHTML=dashboard();else if(tab==="Chapters")a.innerHTML=chapters();else if(tab==="Daily Log")a.innerHTML=logs();else if(tab==="Mock Tests")a.innerHTML=mocks();else if(tab==="Weak Topics")a.innerHTML=weak();else a.innerHTML=backup();bind();}
function dashboard(){let t=totals(),overall=pct(t.marks,t.all.length*4),today=new Date(),deadline=new Date("2027-04-15T23:59:59"),start=new Date("2026-11-20T00:00:00"),timepct=Math.max(0,Math.min(100,pct(Math.max(0,today-start),deadline-start)));return `<div class="notice">Starter chapter headings are broad placeholders and <b>not verified</b> against the official ICAI May 2027 CA Final syllabus. Rename/add chapters in Chapters as needed.</div><div class="cards"><div class="card"><div class="muted">Overall milestones</div><div class="metric">${overall}%</div>${progressbar(overall)}</div><div class="card"><div class="muted">Exam-ready chapters</div><div class="metric">${t.done}/${t.all.length}</div>${progressbar(pct(t.done,t.all.length))}</div><div class="card"><div class="muted">Milestones checked</div><div class="metric">${t.marks}/${t.all.length*4}</div></div><div class="card"><div class="muted">Deadline · 15 April</div><div class="metric">${Math.max(0,Math.ceil((deadline-today)/86400000))} days</div><div class="muted">Calendar progress since 20 Nov (approx.)</div>${progressbar(timepct)}</div></div><div class="section card"><h2>Subject progress</h2><div class="subject-list">${subjects.map(s=>`<div class="subject-row"><div><strong>${s} · ${full[s]}</strong><div class="muted">${Object.values(data[s].chapters).filter(c=>c.exam).length} exam-ready chapters</div></div>${progressbar(subjectPct(s))}<button class="btn small" onclick="tab='Chapters';subject='${s}';render()">Open</button></div>`).join("")}</div></div><div class="section card"><h2>Revision milestone progress</h2>${["Lecture","Revision 1","Revision 2","Exam Ready"].map((m,i)=>{let n=t.all.filter(c=>[c.lecture,c.r1,c.r2,c.exam][i]).length;return `<div class="subject-row"><strong>${m}</strong>${progressbar(pct(n,t.all.length))}<span class="muted">${n}/${t.all.length}</span></div>`}).join("")}</div><div class="section card"><h2>Recent daily logs</h2>${data.logs.length?data.logs.slice(-3).reverse().map(l=>`<p><b>${esc(l.date)}</b> · ${esc(l.actual||0)} hrs · ${esc(l.topics||"")}</p>`).join(""):`<p class="muted">No study logs yet.</p>`}</div>`}
function chapters(){let cs=data[subject].chapters;return `<div class="toolbar"><label>Subject</label><select class="select" style="max-width:250px" onchange="subject=this.value;render()">${subjects.map(s=>`<option ${s===subject?"selected":""} value="${s}">${s} · ${full[s]}</option>`).join("")}</select><button class="btn" onclick="addChapter()">+ Add chapter</button></div><div class="card section"><h2>${subject} · ${full[subject]}</h2>${progressbar(subjectPct(subject))}<p class="muted">Each chapter: Lecture → Revision 1 → Revision 2 → Exam Ready (Revision 3, active recall & timed questions)</p></div>${Object.entries(cs).map(([id,c])=>`<div class="chapter"><div class="chapter-top"><div class="chapter-title">${esc(c.name)}</div><button class="btn small" onclick="renameChapter('${subject}','${id}')">Rename</button></div><div class="checks">${[['lecture','Lecture'],['r1','Revision 1'],['r2','Revision 2'],['exam','Exam Ready']].map(([k,l])=>`<label><input type="checkbox" ${c[k]?'checked':''} onchange="data['${subject}'].chapters['${id}']['${k}']=this.checked;save();render()"> ${l}</label>`).join("")}</div></div>`).join("")}`}
function logs(){return `<div class="card"><h2>Add daily study log</h2><div class="formgrid"><label>Date<input id="ldate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Target hours<input id="target" type="number" min="0" step=".25"></label><label>Actual hours<input id="actual" type="number" min="0" step=".25"></label><label>Lectures completed<input id="lectures" type="number" min="0"></label><label>Questions practised<input id="questions" type="number" min="0"></label></div><p><label>Topics covered<textarea id="topics"></textarea></label></p><p><label>Notes / observations<textarea id="notes"></textarea></label></p><div class="checks">${subjects.map(s=>`<label><input type="checkbox" id="daily_${s}">${s}</label>`).join("")}</div><button class="btn primary section" onclick="addLog()">Save daily log</button></div><div class="section card"><h2>History</h2>${data.logs.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Target</th><th>Actual</th><th>Lectures</th><th>Questions</th><th>Subjects</th><th>Topics / notes</th><th></th></tr>${data.logs.slice().reverse().map((l,i)=>`<tr><td>${esc(l.date)}</td><td>${esc(l.target)}</td><td>${esc(l.actual)}</td><td>${esc(l.lectures)}</td><td>${esc(l.questions)}</td><td>${esc(l.subjects.join(", "))}</td><td>${esc(l.topics)} ${esc(l.notes)}</td><td><button class="btn small danger" onclick="delLog(${data.logs.length-1-i})">Delete</button></td></tr>`).join("")}</table></div>`:`<div class="empty">No logs recorded.</div>`}</div>`}
function mocks(){return `<div class="notice">Enter marks out of 100 for each paper. Blank fields remain unscored.</div>${data.mocks.map((m,i)=>{let sum=subjects.reduce((n,s)=>n+(Number(m[s])||0),0),count=subjects.filter(s=>m[s]!==undefined&&m[s]!=="" ).length;return `<div class="card section"><h2>Mock Test ${i+1}</h2><div class="formgrid">${subjects.map(s=>`<label>${s}<input type="number" min="0" max="100" step="1" value="${esc(m[s]??"")}" onchange="data.mocks[${i}]['${s}']=this.value;save();render()"></label>`).join("")}</div><p><b>Total:</b> ${count?sum:"—"} / ${count*100} <b> · Percentage:</b> ${count?pct(sum,count*100)+"%":"—"}</p>${count?`<div class="progress"><span style="width:${pct(sum,count*100)}%"></span></div>`:""}</div>`}).join("")}<div class="card section"><h2>Score comparison</h2><div class="tablewrap"><table><tr><th>Paper</th>${data.mocks.map((_,i)=>`<th>Mock ${i+1}</th>`).join("")}<th>Change (3 vs 1)</th></tr>${subjects.map(s=>`<tr><td>${s}</td>${data.mocks.map(m=>`<td>${m[s]!==undefined&&m[s]!==""?esc(m[s]):"—"}</td>`).join("")}<td>${data.mocks[0][s]!==undefined&&data.mocks[2][s]!==undefined&&data.mocks[0][s]!==""&&data.mocks[2][s]!==""?Number(data.mocks[2][s])-Number(data.mocks[0][s]):"—"}</td></tr>`).join("")}</table></div></div>`}
function weak(){
 data.weakFolders=data.weakFolders||{};data.weakSubjectNames=data.weakSubjectNames||{};
 const allSubjects="__ALL_SUBJECTS__",s=window.weakSubjectFilter||subjects[0],rawChapter=window.weakChapterFilter,ch=rawChapter==null||rawChapter===""?"__ALL__":rawChapter;
 const folders=s===allSubjects?[...new Set(subjects.flatMap(x=>weakFolderNames(x)))].sort((a,b)=>a.localeCompare(b)):weakFolderNames(s);
 let list=data.weak.map((w,i)=>({w:w,i:i})).filter(x=>(s===allSubjects||x.w.subject===s)&&(ch==="__ALL__"||(x.w.chapter||"Unsorted")===ch));
 if(s===allSubjects&&ch==="__ALL__")list.sort((a,b)=>(a.w.topic||"").localeCompare(b.w.topic||"",undefined,{sensitivity:"base"}));
 const manageDisabled=s===allSubjects?" disabled":"";
 let html='<div class="card"><div class="toolbar"><h2>Weak Topics · Doubt Bank</h2><button class="btn small"'+manageDisabled+' onclick="renameWeakSubject()">Rename subject</button></div><p class="muted">Organise your existing doubts and attachments into editable subject and chapter folders.</p><div class="formgrid"><label>Subject folder<select id="weakSubjectSelect" onchange="window.weakSubjectFilter=this.value;window.weakChapterFilter=\'__ALL__\';render()"><option value="'+allSubjects+'" '+(s===allSubjects?'selected':'')+'>All subjects</option>';
 subjects.forEach(x=>{html+='<option value="'+x+'" '+(s===x?'selected':'')+'>'+esc(weakSubjectLabel(x))+'</option>'});
 html+='</select></label><label>Chapter folder<select id="weakChapterSelect" onchange="window.weakChapterFilter=this.value;render()"><option value="__ALL__" '+(ch==="__ALL__"?'selected':'')+'>All chapters</option>';
 folders.forEach(x=>{html+='<option value="'+esc(x)+'" '+(ch===x?'selected':'')+'>'+esc(x)+'</option>'});
 html+='<option value="Unsorted" '+(ch==="Unsorted"?'selected':'')+'>Unsorted</option></select></label></div><div class="toolbar section"><button class="btn small"'+manageDisabled+' onclick="addWeakChapterFolder()">+ Add chapter</button><button class="btn small"'+manageDisabled+' onclick="renameWeakChapterFolder()">Rename chapter</button><button class="btn small danger"'+manageDisabled+' onclick="deleteWeakChapterFolder()">Delete chapter</button></div><p class="muted">Deleting a chapter folder moves its doubts to Unsorted; attachments are retained.</p></div>';
 const addSubject=subjects.includes(s)?s:subjects[0];
 html+='<div class="card section"><h2>Add a doubt</h2><div class="formgrid"><label>Subject<select id="wsub" onchange="refreshWeakChapterChoices()">';
 subjects.forEach(x=>{html+='<option value="'+x+'" '+(addSubject===x?'selected':'')+'>'+esc(weakSubjectLabel(x))+'</option>'});
 html+='</select></label><label>Chapter folder<select id="wchapter">'+weakFolderOptions(addSubject)+'</select></label><label>Topic / doubt title<input id="wtopic" placeholder="Enter your doubt"></label><label>Reason / question<textarea id="wreason"></textarea></label><label>Priority<select id="wpriority"><option>High</option><option>Medium</option><option>Low</option></select></label><label>Attachment<input id="wattachment" type="file"></label></div><button class="btn primary section" onclick="addWeak()">Save doubt</button></div>';
 html+='<div class="card section"><h2>Saved doubts ('+list.length+')'+(s===allSubjects&&ch==="__ALL__"?' · A–Z':'')+'</h2><input id="weakSearch" placeholder="Search doubts..." oninput="filterWeakDoubts()"><div id="weakDoubtCards" class="cards section">';
 if(!list.length)html+='<div class="empty">No doubts in this folder yet.</div>';
 list.forEach(x=>{let w=x.w,i=x.i;html+='<div class="card weak-doubt-card" data-search="'+esc([weakSubjectLabel(w.subject),w.chapter,w.topic,w.reason].join(' ').toLowerCase())+'"><div class="muted">'+esc(weakSubjectLabel(w.subject))+' · '+esc(w.chapter||'Unsorted')+' · '+esc(w.priority||'Medium')+' priority</div><h3>'+esc(w.topic)+'</h3><p><b>Question:</b> '+esc(w.reason||'—')+'</p>'+weakAttachmentLinks(w)+'<label><input type="checkbox" '+(w.resolved?'checked':'')+' onchange="data.weak['+i+'].resolved=this.checked;save();render()"> Solved</label><div class="toolbar section"><button class="btn small" onclick="editWeakDoubt('+i+')">Edit</button><button class="btn small" onclick="replaceWeakAttachment('+i+')">Replace attachments</button><button class="btn small" onclick="addWeakAttachment('+i+')">Add another attachment</button><button class="btn small danger" onclick="deleteWeakDoubt('+i+')">Delete</button></div></div>'});
 html+='</div></div>';return html;
}
function weakSubjectLabel(s){return data.weakSubjectNames[s]||full[s]||s||"Unsorted"}
function weakFolderNames(s){let a=data.weakFolders[s]||[];data.weak.forEach(w=>{if(w.subject===s&&w.chapter&&w.chapter!=="Unsorted"&&!a.includes(w.chapter))a.push(w.chapter)});return [...new Set(a)].sort()}
function weakFolderOptions(s){return '<option value="">Unsorted</option>'+weakFolderNames(s).map(x=>'<option>'+esc(x)+'</option>').join('')}
function refreshWeakChapterChoices(){document.getElementById("wchapter").innerHTML=weakFolderOptions(document.getElementById("wsub").value)}
function renameWeakSubject(){let s=document.getElementById("weakSubjectSelect").value,n=prompt("Rename subject folder:",weakSubjectLabel(s));if(n&&n.trim()){data.weakSubjectNames[s]=n.trim();save();render()}}
function addWeakChapterFolder(){let s=document.getElementById("weakSubjectSelect").value,n=prompt("New chapter folder name:");if(!n||!n.trim())return;data.weakFolders[s]=data.weakFolders[s]||[];if(weakFolderNames(s).includes(n.trim())){alert("Folder already exists.");return}data.weakFolders[s].push(n.trim());window.weakSubjectFilter=s;window.weakChapterFilter=n.trim();save();render()}
function renameWeakChapterFolder(){let s=document.getElementById("weakSubjectSelect").value,old=document.getElementById("weakChapterSelect").value;if(!old||old==="Unsorted"){alert("Select a chapter folder first.");return}let n=prompt("Rename chapter folder:",old);if(!n||!n.trim())return;data.weak.forEach(w=>{if(w.subject===s&&(w.chapter||"Unsorted")===old)w.chapter=n.trim()});data.weakFolders[s]=(data.weakFolders[s]||[]).map(x=>x===old?n.trim():x);window.weakChapterFilter=n.trim();save();render()}
function deleteWeakChapterFolder(){let s=document.getElementById("weakSubjectSelect").value,ch=document.getElementById("weakChapterSelect").value;if(!ch||ch==="Unsorted"){alert("Select a chapter folder first.");return}if(!confirm("Delete folder? Its doubts will move to Unsorted."))return;data.weak.forEach(w=>{if(w.subject===s&&(w.chapter||"Unsorted")===ch)w.chapter=""});data.weakFolders[s]=(data.weakFolders[s]||[]).filter(x=>x!==ch);window.weakChapterFilter="";save();render()}
function filterWeakDoubts(){let q=(document.getElementById("weakSearch").value||"").toLowerCase();document.querySelectorAll(".weak-doubt-card").forEach(x=>x.style.display=x.dataset.search.includes(q)?"":"none")}
function editWeakDoubt(i){let w=data.weak[i],t=prompt("Edit doubt title:",w.topic||"");if(t===null)return;let r=prompt("Edit question:",w.reason||"");if(r===null)return;let c=prompt("Chapter folder (blank = Unsorted):",w.chapter||"");if(c===null)return;w.topic=t.trim();w.reason=r;w.chapter=c.trim();if(w.chapter){data.weakFolders[w.subject]=data.weakFolders[w.subject]||[];if(!data.weakFolders[w.subject].includes(w.chapter))data.weakFolders[w.subject].push(w.chapter)}save();render()}
function deleteWeakDoubt(i){if(confirm("Delete this doubt and its attachment?")){data.weak.splice(i,1);save();render()}}

function backup(){return `<div class="card"><h2>Backup & restore</h2><p>Export your full study hub data as JSON or import a backup on this device/browser.</p><div class="toolbar"><button class="btn primary" onclick="exportData()">Export JSON backup</button><label class="btn">Import JSON<input type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"></label><button class="btn danger" onclick="resetData()">Reset all data</button></div><p class="muted section">Automatic saving uses local browser storage. Clearing Chrome data or using a different browser/device may erase or not carry over your progress. Export regularly.</p></div>`}
function bind(){}
function addChapter(){let name=prompt("Chapter name?");if(name?.trim()){let id="new"+Date.now();data[subject].chapters[id]={name:name.trim(),lecture:false,r1:false,r2:false,exam:false};save();render()}}
function renameChapter(s,id){let n=prompt("Rename chapter:",data[s].chapters[id].name);if(n?.trim()){data[s].chapters[id].name=n.trim();save();render()}}
function addLog(){let l={date:document.getElementById("ldate").value,target:document.getElementById("target").value,actual:document.getElementById("actual").value,lectures:document.getElementById("lectures").value,questions:document.getElementById("questions").value,topics:document.getElementById("topics").value,notes:document.getElementById("notes").value,subjects:subjects.filter(s=>document.getElementById("daily_"+s).checked)};data.logs.push(l);save();render()}
function delLog(i){if(confirm("Delete this log?")){data.logs.splice(i,1);save();render()}}
function readAttachment(file){return new Promise((resolve,reject)=>{if(!file){resolve(null);return}let r=new FileReader();r.onload=()=>resolve({name:file.name,type:file.type,data:r.result});r.onerror=reject;r.readAsDataURL(file)})}
async function addWeak(){let file=document.getElementById("wattachment").files[0];let w={subject:document.getElementById("wsub").value,chapter:document.getElementById("wchapter").value,topic:document.getElementById("wtopic").value,reason:document.getElementById("wreason").value,priority:document.getElementById("wpriority").value,resolved:false,attachment:await readAttachment(file)};if(!w.topic.trim()){alert("Please enter the weak topic.");return}data.weak.push(w);save();render()}
function weakAttachmentList(w){return [...(w.attachment?[w.attachment]:[]),...(Array.isArray(w.attachments)?w.attachments:[])].filter(Boolean)}
function weakAttachmentLinks(w){let a=weakAttachmentList(w);return a.length?a.map((f,j)=>'<p><a href="'+f.data+'" download="'+esc(f.name)+'">'+esc(f.name)+'</a></p>').join(''):'<p class="muted">No attachment</p>'}
function chooseWeakFiles(multiple,onFiles){let picker=document.createElement("input");picker.type="file";picker.multiple=multiple;picker.onchange=async()=>{if(picker.files&&picker.files.length){let files=await Promise.all(Array.from(picker.files).map(readAttachment));onFiles(files)}};picker.click()}
function replaceWeakAttachment(i){chooseWeakFiles(false,files=>{data.weak[i].attachment=files[0];data.weak[i].attachments=[];save();render()})}
function addWeakAttachment(i){chooseWeakFiles(true,files=>{let w=data.weak[i];w.attachments=Array.isArray(w.attachments)?w.attachments:[];w.attachments.push(...files);save();render()})}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="ca-final-study-hub-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let incoming=JSON.parse(r.result);if(!confirm("Import and replace current data?"))return;data=incoming;init();render();alert("Backup restored.")}catch(e){alert("Invalid backup file.")}};r.readAsText(file)}
function resetData(){if(confirm("This permanently resets study hub data in this browser. Export a backup first if needed. Continue?")&&confirm("Confirm reset?")){localStorage.removeItem("cafinalhub");data={};init();render()}}
render();
